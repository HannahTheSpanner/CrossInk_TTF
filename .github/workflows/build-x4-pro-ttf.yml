name: Build X4 Pro firmware (TTF fork)

# Builds the X4 Pro firmware on every push to this fork's main or TTF branch
# (or on demand from the Actions tab) and attaches the .bin as a downloadable
# artifact. Flash it with Settings > System > SD Card Firmware Update.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/ttf-fonts]

concurrency:
  group: build-x4-pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build X4 Pro firmware
        run: |
          set -euo pipefail
          pio run -j1 -e x4-pro | tee pio-x4-pro.log

      - name: Name the firmware after this commit
        id: name
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          cp .pio/build/x4-pro/firmware-x4-pro.bin "firmware-x4-pro-ttf-${short}.bin"
          echo "file=firmware-x4-pro-ttf-${short}.bin" >> "$GITHUB_OUTPUT"
          {
            echo "## X4 Pro firmware (${short})"
            grep -E "RAM:\s|Flash:\s" pio-x4-pro.log | while read -r line; do echo "- ${line}"; done
            echo
            echo "Download the artifact below, unzip it, copy the .bin to the SD card and use"
            echo "Settings > System > SD Card Firmware Update."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro-ttf-${{ github.sha }}
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error
